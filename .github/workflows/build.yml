      - name: Build APT repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p repo/debs
          cp packages/*.deb repo/debs/
          cp combined-package/*.deb repo/debs/
          # DauDat-CarPlay artifact API no longer available: reuse unchanged
          # signed external DEBs from the existing public Sileo APT index.
          mkdir -p external
          python3 - <<'PY'
          import hashlib, re, subprocess
          from pathlib import Path
          site='https://chuongnguyen89dn-ui.github.io/carplaydsp'
          contents=subprocess.check_output(['curl','-fLsS','--retry','4',site+'/Packages'],text=True)
          records=[]
          for block in contents.split('\n\n'):
              rec={}
              for line in block.splitlines():
                  if ': ' in line and not line.startswith(' '):
                      k,v=line.split(': ',1);rec[k]=v
              if rec:records.append(rec)
          # The published artifact has one integrated DuoDash/Airaw DEB.
          # A separate Airaw DEB is not indexed; do not fabricate one.
          pats=(r'debs/DuoDash_[A-Za-z0-9.+~_-]+_iphoneos-arm64\.deb',)
          for pat in pats:
              hits=[r for r in records if re.fullmatch(pat,r.get('Filename',''))]
              assert len(hits)==1,(pat,len(hits),'expected exactly one published archive')
              r=hits[0]
              assert re.fullmatch('[0-9a-f]{64}',r.get('SHA256',''))
              assert r.get('Size','').isdigit()
              assert r.get('Architecture')=='iphoneos-arm64'
              assert re.fullmatch('[A-Za-z0-9.+~:_-]+',r.get('Version',''))
              assert re.fullmatch('[A-Za-z0-9.+_-]+',r.get('Package',''))
              out=Path('external')/Path(r['Filename']).name
              subprocess.run(['curl','-fLsS','--retry','4','--max-time','120',site+'/'+r['Filename'],'-o',str(out)],check=True)
              data=out.read_bytes()
              assert hashlib.sha256(data).hexdigest()==r['SHA256']
              assert len(data)==int(r['Size'])
              for field in ('Package','Version','Architecture'):
                  assert subprocess.check_output(['dpkg-deb','-f',str(out),field],text=True).strip()==r[field],field
              print('RETAINED_BYTE_IDENTICAL_EXTERNAL_SIGNED_PACKAGE',r['Filename'])
          PY
          cp external/*.deb repo/debs/

          # VisualTest12 functional activation-gate repair (candidate awaiting device QA).
          # Restore exact original VisualTest12 core; inject one ABI-pinned repair dylib.
          # NO DuoDash or Airaw binary copied; independent Hub package remains untouched.
          DUOFACE_URL='https://raw.githubusercontent.com/chuongnguyen89dn-ui/Duoface/9683dcfb2d85fa9e513f360c4ad8bbc2b2ebbbe8/dist/visualtest12-repair1/com.duonavi.app_1.0.3-12~visualtest12repair1_iphoneos-arm64.deb'
          DUOFACE_FILE='repo/debs/com.duonavi.app_1.0.3-12~visualtest12repair1_iphoneos-arm64.deb'
          curl -fL --retry 3 "$DUOFACE_URL" -o "$DUOFACE_FILE"
          (cd repo/debs && printf '%s  %s\n' 'b2cc38bd50862df5fd9ec69bd4c62010c0623263a14346c695e895a92709753f' 'com.duonavi.app_1.0.3-12~visualtest12repair1_iphoneos-arm64.deb' | shasum -a 256 -c -)
          test "$(dpkg-deb -f "$DUOFACE_FILE" Package)" = 'com.duonavi.app'
          test "$(dpkg-deb -f "$DUOFACE_FILE" Version)" = '1.0.3-12~visualtest12repair1'
          test "$(dpkg-deb -f "$DUOFACE_FILE" Architecture)" = 'iphoneos-arm64'
          dpkg-deb --contents "$DUOFACE_FILE" | grep -F 'DuoFaceVisualHook.dylib'
