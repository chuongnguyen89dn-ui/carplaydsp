          FILE='com.duoface.carplay.gate1smoke_0.0.7~fbsquery1_iphoneos-arm64.deb'
          SHA='01679b3f1f2fdc56affc291700ddda3d69305dfeee572a7bbad173f9f87b7320'
          for attempt in $(seq 1 24); do
            curl -fLsS --max-time 25 "$SITE/Packages" -o "$RUNNER_TEMP/gate1-public-Packages" || true
            if grep -Fqx "SHA256: $SHA" "$RUNNER_TEMP/gate1-public-Packages" 2>/dev/null; then break; fi
            echo "Checking Gate1 on Pages CDN: $attempt/24"
            sleep 10
          done
          PKG="$PKG" VER="$VER" FILE="$FILE" SHA="$SHA" python3 - <<'PY'
          import os
          from pathlib import Path
          contents=Path(os.environ['RUNNER_TEMP'],'gate1-public-Packages').read_text()
          found=[]
          for stanza in contents.split('\n\n'):
              record={}
              for line in stanza.splitlines():
                  if ': ' in line and not line.startswith(' '):
                      key,value=line.split(': ',1);record[key]=value
              if record.get('Package')==os.environ['PKG']:found.append(record)
          assert len(found)==1,found
          item=found[0]
          assert item['Version']==os.environ['VER'],item
          assert item['Filename']=='debs/'+os.environ['FILE'],item
          assert item['SHA256']==os.environ['SHA'],item
          assert item['Architecture']=='iphoneos-arm64',item
          assert not any(item.get(field) for field in ('Conflicts','Replaces','Breaks','Provides')),item
          assert 'com.duoface.independent' not in item.get('Depends',''),item
          print('GATE1_PUBLIC_SILEO_SINGLE_ISOLATED_APT_ENTRY_PASS')
          PY
          curl -fLsS --retry 4 "$SITE/debs/$FILE" -o "$RUNNER_TEMP/gate1-public.deb"
          printf '%s  %s\n' "$SHA" "$RUNNER_TEMP/gate1-public.deb" | shasum -a 256 -c -
          test "$(dpkg-deb -f "$RUNNER_TEMP/gate1-public.deb" Package)" = "$PKG"
          test "$(dpkg-deb -f "$RUNNER_TEMP/gate1-public.deb" Version)" = "$VER"
          echo 'GATE1_PUBLIC_SILEO_BINARY_SHA256_PASS_NO_DEVICE_CARPLAY_PROOF'
