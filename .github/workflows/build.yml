name: Build and publish Sileo repo
# DuoDash-Airaw geometry sync: 6

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos and iOS SDK
        run: |
          brew install ldid xz dpkg
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          rm -rf "$HOME/theos/sdks"
          git clone --depth=1 https://github.com/theos/sdks.git "$HOME/theos/sdks"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          test -n "$(find "$HOME/theos/sdks" -maxdepth 1 -type d -name '*.sdk' -print -quit)"

      - name: Build corrected independent CarPlay Split
        run: |
          rm -f independent-split/packages/com.chuong.carplaysplit_*.deb packages/com.chuong.carplaysplit_*.deb
          bash independent-split/build.sh
          cp independent-split/packages/*.deb packages/

      - name: Set unique package version
        run: |
          sed -i '' "s/^Version:.*/Version: 0.0.${GITHUB_RUN_NUMBER}/" control

      - name: Build rootless package
        run: make clean package FINALPACKAGE=1

      - name: Build combined DuoDash + Airaw package
        shell: bash
        run: |
          set -euo pipefail
          brew install dpkg || true
          rm -rf /tmp/duo /tmp/aira /tmp/combined
          curl -fL "https://raw.githubusercontent.com/chuongnguyen89dn-ui/DauDat-CarPlay/main/DuoDash_1.1.3_Fullscreen427_iphoneos-arm64.deb" -o /tmp/duo.deb
          curl -fL "https://raw.githubusercontent.com/chuongnguyen89dn-ui/DauDat-CarPlay/main/com.Axs.airaw_1.6.7_iphoneos-arm64.deb" -o /tmp/aira.deb
          dpkg-deb -R /tmp/duo.deb /tmp/duo
          dpkg-deb -R /tmp/aira.deb /tmp/aira
          mkdir -p /tmp/combined/DEBIAN
          cp -a /tmp/duo/var /tmp/combined/
          cp -a /tmp/aira/var /tmp/combined/
          mkdir -p /tmp/combined/var/jb/Library/MobileSubstrate/DynamicLibraries
          cp .theos/_/var/jb/Library/MobileSubstrate/DynamicLibraries/DuoDashAirawConflictProbe.dylib /tmp/combined/var/jb/Library/MobileSubstrate/DynamicLibraries/
          cp .theos/_/var/jb/Library/MobileSubstrate/DynamicLibraries/DuoDashAirawConflictProbe.plist /tmp/combined/var/jb/Library/MobileSubstrate/DynamicLibraries/
          cat > /tmp/combined/DEBIAN/control <<'EOF'
          Package: com.chuong.duodash-airaw
          Name: DuoDash + Airaw
          Version: 1.0.3
          Architecture: iphoneos-arm64
          Maintainer: chuongnguyen89dn-ui
          Author: SenseTechLab / Axs
          Section: Tweaks
          Depends: mobilesubstrate (>= 0.9.5000) | ellekit, firmware (>= 14.0), preferenceloader, ws.hbang.common, com.opa334.ccsupport
          Conflicts: com.sensetechlab.duodash, com.axs.airaw, com.carnav.hud, com.carnav.core, com.carnav.bridge, com.carnav.hook, com.carnav.hud.prefs, com.carnav.prefs.refresh, com.carnav.hud.carplaydashboard, com.carnav.hud.appbridge, com.sensetechlab.carsleeper, com.sensetechlab.carplaytweak, com.sensetechlab.core, com.sensetechlab.bridge, com.sensetechlab.prefs.refresh, com.sensetechlab.duodash.prefs, com.sensetechlab.duodash.appbridge
          Replaces: com.sensetechlab.duodash, com.axs.airaw, com.carnav.hud, com.carnav.core, com.carnav.bridge, com.carnav.hook, com.carnav.hud.prefs, com.carnav.prefs.refresh, com.carnav.hud.carplaydashboard, com.carnav.hud.appbridge, com.sensetechlab.carsleeper, com.sensetechlab.carplaytweak, com.sensetechlab.core, com.sensetechlab.bridge, com.sensetechlab.prefs.refresh, com.sensetechlab.duodash.prefs, com.sensetechlab.duodash.appbridge
          Provides: com.sensetechlab.duodash, com.axs.airaw, com.carnav.hud, com.carnav.core, com.carnav.bridge, com.carnav.hud.prefs, com.carnav.prefs.refresh, com.sensetechlab.core, com.sensetechlab.bridge, com.sensetechlab.prefs.refresh, com.sensetechlab.duodash.prefs
          Description: Combined rootless package containing DuoDash 1.1.3+fullscreen1 and Airaw 1.6.7 for CarPlay.
          EOF
          cat > /tmp/combined/DEBIAN/postinst <<'EOF'
          #!/var/jb/bin/sh
          set -e
          JB=""; [ -d /var/jb ] && JB="/var/jb"
          LOGDIR="/var/mobile/Documents/DuoDash-Airaw-Logs"
          LOGFILE="$LOGDIR/Conflict.log"
          mkdir -p "$LOGDIR"
          touch "$LOGFILE"
          chown -R mobile:mobile "$LOGDIR" 2>/dev/null || true
          chmod 0775 "$LOGDIR" 2>/dev/null || true
          chmod 0664 "$LOGFILE" 2>/dev/null || true
          printf '\n%s | PACKAGE INSTALLED com.chuong.duodash-airaw 1.0.1\n' "$(date '+%Y-%m-%d %H:%M:%S')" >> "$LOGFILE"

          for d in "$JB/Library/Airaw" "$JB/Library/Airaw/Preferences" "$JB/Library/Airaw/backup"; do [ -d "$d" ] && chown mobile:mobile "$d" 2>/dev/null || true; done
          if [ -f "$JB/Library/LaunchDaemons/com.sensetechlab.autoinject.plist" ]; then
            launchctl unload "$JB/Library/LaunchDaemons/com.sensetechlab.autoinject.plist" 2>/dev/null || true
            launchctl load "$JB/Library/LaunchDaemons/com.sensetechlab.autoinject.plist" 2>/dev/null || true
          fi
          for r in bridge carsleep appbridge_cp prefsrefresh siriprobe; do rm -f "/var/mobile/Library/DuoDash/$r.arm" "/var/mobile/Library/DuoDash/$r.state" 2>/dev/null || true; done
          touch /var/mobile/Library/DuoDash/respring_planned 2>/dev/null || true
          killall -HUP SpringBoard 2>/dev/null || true
          exit 0
          EOF
          cp /tmp/duo/DEBIAN/prerm /tmp/combined/DEBIAN/prerm
          chmod 0755 /tmp/combined/DEBIAN /tmp/combined/DEBIAN/postinst /tmp/combined/DEBIAN/prerm
          chmod 0644 /tmp/combined/DEBIAN/control
          mkdir -p combined-package
          dpkg-deb --build --root-owner-group /tmp/combined combined-package/DuoDash-Airaw_1.0.3_iphoneos-arm64.deb
          dpkg-deb -c combined-package/DuoDash-Airaw_1.0.3_iphoneos-arm64.deb > /tmp/combined-contents.txt
          grep -q 'DuoDash.dylib' /tmp/combined-contents.txt
          grep -q 'Airaw.dylib' /tmp/combined-contents.txt
          grep -q 'DuoDashAirawConflictProbe.dylib' /tmp/combined-contents.txt

      - name: Restore complete original DuoDash payload for Sileo
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            'https://raw.githubusercontent.com/chuongnguyen89dn-ui/DauDat-CarPlay/5f683ad16a2c4f2b37e333e891cfb8f7ba3e0d6b/DuoDash_1.1.3_Fullscreen427_iphoneos-arm64.deb' \
            -o "$RUNNER_TEMP/duodash-base.deb"
          python3 scripts/package-duodash-fullscreen.py \
            "$RUNNER_TEMP/duodash-base.deb" \
            packages/com.chuong.duodash-fullscreen-complete_1.1.3+adapter1~test4_iphoneos-arm64.deb
          dpkg-deb -I packages/com.chuong.duodash-fullscreen-complete_*.deb
          dpkg-deb -c packages/com.chuong.duodash-fullscreen-complete_*.deb

      - name: Add byte-identical DuoDash source baseline
        shell: bash
        run: |
          set -euo pipefail
          BASE="packages/DuoDash-Source_1.1.3+fullscreen1_iphoneos-arm64.deb"
          curl -fL --retry 3 \
            'https://raw.githubusercontent.com/chuongnguyen89dn-ui/DauDat-CarPlay/5f683ad16a2c4f2b37e333e891cfb8f7ba3e0d6b/DuoDash_1.1.3_Fullscreen427_iphoneos-arm64.deb' \
            -o "$BASE"
          printf '%s  %s\n' 'ea0d3bb8c8b9da2b45c3f158f390a7966419e84899f820d06f45cd51401fa465' "$BASE" | shasum -a 256 -c -
          dpkg-deb -I "$BASE"

      - name: Build APT repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p repo/debs
          cp packages/*.deb repo/debs/
          cp combined-package/*.deb repo/debs/
          mkdir -p external
          curl -fL -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/chuongnguyen89dn-ui/DauDat-CarPlay/actions/artifacts?name=DauDat-CarPlay&per_page=1" -o /tmp/artifacts.json
          ARTIFACT_URL=$(python3 -c 'import json; d=json.load(open("/tmp/artifacts.json")); print(d["artifacts"][0]["archive_download_url"])')
          curl -fL -H "Authorization: Bearer ${{ github.token }}" "$ARTIFACT_URL" -o /tmp/duodash-airaw.zip
          unzip -j /tmp/duodash-airaw.zip '*.deb' -d external
          cp external/*.deb repo/debs/

          # DuoFace 1.0.3-12 visual test: verified binary from DuoFace GitHub.
          # Keep all unrelated CarPlay packages unchanged.
          DUOFACE_URL='https://raw.githubusercontent.com/chuongnguyen89dn-ui/Duoface/fab16e4bd06f7f25611740a556739bfb9393d002/dist/visual-1.0.3-12/com.duoface.app_1.0.3-12_visualtest_iphoneos-arm64.deb'
          DUOFACE_FILE='repo/debs/com.duoface.app_1.0.3-12_visualtest_iphoneos-arm64.deb'
          curl -fL --retry 3 "$DUOFACE_URL" -o "$DUOFACE_FILE"
          (cd repo/debs && printf '%s  %s\n' '8b7dedf77b9ec05465b83fdb6e2d7127800eac232a34ecf12f2c08b3983a481a' 'com.duoface.app_1.0.3-12_visualtest_iphoneos-arm64.deb' | shasum -a 256 -c -)
          test "$(dpkg-deb -f "$DUOFACE_FILE" Package)" = 'com.duonavi.app'
          test "$(dpkg-deb -f "$DUOFACE_FILE" Version)" = '1.0.3-12~visualtest'
          test "$(dpkg-deb -f "$DUOFACE_FILE" Architecture)" = 'iphoneos-arm64'
          dpkg-deb --contents "$DUOFACE_FILE" | grep -F 'DuoFaceVisualHook.dylib'
          # Original DuoNavi package ID intentionally selected by user; remove older DuoFace builds.
          find repo/debs -maxdepth 1 -type f -name 'com.duoface.app_*.deb' ! -name 'com.duoface.app_1.0.3-12_visualtest_iphoneos-arm64.deb' -delete

          # NATIVE20: DuoFace-only identity. Same UI and CarPlay features as native19.
          # Original iPhone+Dashboard executable code is byte-for-byte unchanged.
          # One-time non-destructive settings migration, strict ZERO old-brand scan.
          # Native19/native18 remain available as committed rollback artifacts.
          DUOFACE_NEW_URL='https://raw.githubusercontent.com/chuongnguyen89dn-ui/Duoface/4c9d4ec191ab125b0ea57bed43a2133ecfdef94b/dist/payload-migration/native20/com.duoface.independent_0.1.0~native20_iphoneos-arm64.deb'
          DUOFACE_NEW_FILE='repo/debs/com.duoface.independent_0.1.0~native20_iphoneos-arm64.deb'
          curl -fL --retry 3 "$DUOFACE_NEW_URL" -o "$DUOFACE_NEW_FILE"
          printf '%s  %s\n' '020ec9c99eac4b8afc4e96c96c0769e1a83fcd5e687af0e37224e9a8af8778ef' "$DUOFACE_NEW_FILE" | shasum -a 256 -c -
          test "$(dpkg-deb -f "$DUOFACE_NEW_FILE" Package)" = 'com.duoface.independent'
          test "$(dpkg-deb -f "$DUOFACE_NEW_FILE" Version)" = '0.1.0~native20'
          test "$(dpkg-deb -f "$DUOFACE_NEW_FILE" Architecture)" = 'iphoneos-arm64'
          ! dpkg-deb -c "$DUOFACE_NEW_FILE" | grep -F 'A_DuoFaceNativeNoLease'
          for unit in DuoFaceDashboard DuoFaceFullscreenBridge DuoFaceVisualHook DuoFaceLogoGripOnly DuoFaceSmartConnection DuoFaceInCarAddApps DuoFaceSettingsUIRestore; do
            dpkg-deb -c "$DUOFACE_NEW_FILE" | grep -F "$unit.dylib"
          done
          dpkg-deb --ctrl-tarfile "$DUOFACE_NEW_FILE" | tar -xOf - ./preinst > /tmp/duoface-independent-preinst.sh
          sh -n /tmp/duoface-independent-preinst.sh
          grep -Fq 'dpkg-query -S' /tmp/duoface-independent-preinst.sh
          grep -Fq 'cp -p "$old_store" "$new_store"' /tmp/duoface-independent-preinst.sh
          ! grep -Eiq 'duonavi|airaw' /tmp/duoface-independent-preinst.sh
          curl -fL --retry 3 'https://raw.githubusercontent.com/chuongnguyen89dn-ui/Duoface/4c9d4ec191ab125b0ea57bed43a2133ecfdef94b/dist/payload-migration/native20/BAO_CAO.json' -o /tmp/duoface-native20-qa.json
          curl -fL --retry 3 'https://raw.githubusercontent.com/chuongnguyen89dn-ui/Duoface/4c9d4ec191ab125b0ea57bed43a2133ecfdef94b/dist/payload-migration/native20/BRAND_ZERO_AUDIT.json' -o /tmp/duoface-native20-brand.json
          python3 - <<'PY'
          import json
          b=json.load(open('/tmp/duoface-native20-qa.json'))
          a=json.load(open('/tmp/duoface-native20-brand.json'))
          assert b['version']=='0.1.0~native20'
          assert b['new_deb_sha256']=='020ec9c99eac4b8afc4e96c96c0769e1a83fcd5e687af0e37224e9a8af8778ef'
          assert b['source_native19_sha256']=='91feda0a7ff24bd7759b7448303d61fe774b16184e383fc11b6839186fa1ae1d'
          assert b['native12_original_code_section_unchanged_in_both_hosts']
          assert b['new_preferences_owner_path']=='/var/mobile/Library/Preferences/com.duoface.plist'
          assert b['installer_migrates_existing_preferences_if_needed']
          assert b['old_preferences_preserved_for_rollback']
          assert b['legacy_brand_termmatches_all_staged_paths_and_bytes']==0
          assert b['smartconnection_10sec_unchanged']
          assert b['license_settings_ui_unchanged']
          assert b['unchanged_payload_count']==42
          assert len(b['changed_payload_paths'])==3
          assert b['app_picker_device_tested'] is False
          assert b['full_autorestore_device_tested'] is False
          assert a['strict_byte_level_zero_matches']
          assert a['total_detected_by_brand_encoding']=={}
          assert a['affected_paths']==[]
          print('NATIVE20_DUOFACE_NAME_ONLY_MIGRATION_SHA_BRAND_ZERO_PUBLICATION_GATE_PASS')
          PY
          dpkg --compare-versions '0.1.0~native20' gt '0.1.0~native18'
          # Update only the independent DuoFace package; preserve unrelated Sileo packages.
          find repo/debs -maxdepth 1 -type f -name 'com.duoface.independent_*.deb' ! -name 'com.duoface.independent_0.1.0~native20_iphoneos-arm64.deb' -delete

          cd repo
          dpkg-scanpackages -m debs /dev/null > Packages
          python3 ../scripts/label-duodash-baseline.py Packages
          # Sileo icon is APT metadata; iPhone app icons do not populate it.
          curl -fL --retry 3 'https://raw.githubusercontent.com/chuongnguyen89dn-ui/Duoface/main/dist/visual-1.0.3-12/assets/duoface-icon.png' -o duoface-icon.png
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Packages')
          blocks=p.read_text().split('\n\n')
          updated=0
          for i,block in enumerate(blocks):
              if block.startswith('Package: com.duonavi.app\n') or '\nPackage: com.duonavi.app\n' in '\n'+block+'\n':
                  lines=[line for line in block.splitlines() if not line.startswith('Icon: ')]
                  lines.append('Icon: https://chuongnguyen89dn-ui.github.io/carplaydsp/duoface-icon.png')
                  blocks[i]='\n'.join(lines)
                  updated+=1
          if updated!=1:
              raise SystemExit(f'Expected exactly one DuoFace/DuoNavi entry, found {updated}')
          # Gói mới hiển thị riêng trong Sileo, cùng dùng biểu tượng DuoFace gốc.
          independent=0
          for i,block in enumerate(blocks):
              if block.startswith('Package: com.duoface.independent\n'):
                  lines=[line for line in block.splitlines() if not line.startswith('Icon: ')]
                  lines.append('Icon: https://chuongnguyen89dn-ui.github.io/carplaydsp/duoface-icon.png')
                  blocks[i]='\n'.join(lines)
                  independent+=1
          if independent!=1:
              raise SystemExit(f'Expected 1 independent DuoFace, found {independent}')
          p.write_text('\n\n'.join(blocks))
          PY
          gzip -9c Packages > Packages.gz

          cat > Release <<'EOF'
          Origin: CarPlayDSP
          Label: CarPlayDSP
          Suite: stable
          Version: 1.0
          Codename: ios-rootless
          Architectures: iphoneos-arm64
          Components: main
          Description: CarPlayDSP packages for rootless iOS
          EOF

          cat > index.html <<'EOF'
          <!doctype html>
          <html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>CarPlayDSP Repo</title></head>
          <body><h1>CarPlayDSP Repo</h1>
          <p>Add this source to Sileo:</p>
          <p><code>https://chuongnguyen89dn-ui.github.io/carplaydsp/</code></p>
          </body></html>
          EOF
          touch .nojekyll

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarPlayDSP-rootless
          path: packages/*.deb

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: repo

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Sileo repo to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
