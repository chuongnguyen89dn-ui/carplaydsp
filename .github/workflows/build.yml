          # Only replace the VisualTest12 package. Never remove independent Hub.
          find repo/debs -maxdepth 1 -type f -name 'com.duoface.app_*.deb' -delete
          find repo/debs -maxdepth 1 -type f -name 'com.duonavi.app_*.deb' ! -name 'com.duonavi.app_1.0.3-12~visualtest12repair1_iphoneos-arm64.deb' -delete

