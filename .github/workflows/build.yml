          from pathlib import Path

          packages = Path('Packages').read_bytes()
          Path('Packages.bz2').write_bytes(bz2.compress(packages, compresslevel=9))
          Path('Packages.xz').write_bytes(lzma.compress(packages, format=lzma.FORMAT_XZ, preset=6))
          filenames = ('Packages', 'Packages.gz', 'Packages.bz2', 'Packages.xz')
          fields = [
