          assert len([line for line in Path('Packages').read_text().splitlines() if line == 'Package: com.duoface.carplay.nativebridgeqa']) == 1
          assert '0.0.6~dockcrop1' in Path('Packages').read_text()
          print('SILEO_APT_RELEASE_VALID_DATE_CHECKSUMS_NATIVE12_HUB8_AND_NATIVE_SHELL7_VISUAL_QA_PASS')
