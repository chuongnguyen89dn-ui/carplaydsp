          ! dpkg-deb -f "$VISUAL12_QA_FILE" Replaces | grep -Eq 'com.duoface.independent|com.duonavi.app'
          dpkg-deb -c "$VISUAL12_QA_FILE" | grep -F '/DuoFaceVisual12.dylib'
          dpkg-deb -c "$VISUAL12_QA_FILE" | grep -F '/DuoFaceVisual12.app/'
          ! dpkg-deb -c "$VISUAL12_QA_FILE" | grep -Eiq 'DuoFaceIndependent|DuoFaceDashboard|DuoNavi|Airaw|DuoDash'
          printf '%s\n' 'VISUAL12_NATIVE_SHELL7_VISUAL_QA_SHA_METADATA_AND_PATHS_PASS; NATIVE12_HUB8_UNCHANGED'

          find repo/debs -maxdepth 1 -type f -name 'com.duoface.visual12_*.deb' ! -name 'com.duoface.visual12_1.0.3-12~ui8native7_iphoneos-arm64.deb' -delete

          # DuoFace Native12 QA5 center dual-pill and real-pane focus/restore TEST addon. SidePlay binary not included.
          # Remove obsolete QA1/QA2 DEB to keep exactly one APT entry.
          find repo/debs -maxdepth 1 -type f -name 'com.duoface.sideplaydisplay_*.deb' -delete
          SIDEPLAY_QA_URL='https://raw.githubusercontent.com/chuongnguyen89dn-ui/Duoface/d49fa099f3c100607d1e7e6fd1f35922f34eb01c/sideplay/artifacts/native12dock11/com.duoface.sideplaydisplay_0.1.9~native12dock11_iphoneos-arm64.deb'
          SIDEPLAY_QA_DEB='repo/debs/com.duoface.sideplaydisplay_0.1.9~native12dock11_iphoneos-arm64.deb'
