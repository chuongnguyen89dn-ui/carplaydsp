      - name: Build APT repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p repo/debs
          cp packages/*.deb repo/debs/
          cp combined-package/*.deb repo/debs/
          mkdir -p external
          curl -fL -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/chuongnguyen89dn-ui/DauDat-CarPlay/actions/artifacts?name=DauDat-CarPlay&per_page=1" -o /tmp/artifacts.json
          ARTIFACT_URL=$(python3 -c 'import json; d=json.load(open("/tmp/artifacts.json")); print(d["artifacts"][0]["archive_download_url"])')
          curl -fL -H "Authorization: Bearer ${{ github.token }}" "$ARTIFACT_URL" -o /tmp/duodash-airaw.zip
          unzip -j /tmp/duodash-airaw.zip '*.deb' -d external
          cp external/*.deb repo/debs/

          # VisualTest12 functional activation-gate repair (candidate awaiting device QA).
          # Restore exact original VisualTest12 core; inject one ABI-pinned repair dylib.
          # NO DuoDash or Airaw binary copied; independent Hub package remains untouched.
          DUOFACE_URL='https://raw.githubusercontent.com/chuongnguyen89dn-ui/Duoface/9683dcfb2d85fa9e513f360c4ad8bbc2b2ebbbe8/dist/visualtest12-repair1/com.duonavi.app_1.0.3-12~visualtest12repair1_iphoneos-arm64.deb'
          DUOFACE_FILE='repo/debs/com.duonavi.app_1.0.3-12~visualtest12repair1_iphoneos-arm64.deb'
          curl -fL --retry 3 "$DUOFACE_URL" -o "$DUOFACE_FILE"
          (cd repo/debs && printf '%s  %s\n' 'b2cc38bd50862df5fd9ec69bd4c62010c0623263a14346c695e895a92709753f' 'com.duonavi.app_1.0.3-12~visualtest12repair1_iphoneos-arm64.deb' | shasum -a 256 -c -)
          test "$(dpkg-deb -f "$DUOFACE_FILE" Package)" = 'com.duonavi.app'
          test "$(dpkg-deb -f "$DUOFACE_FILE" Version)" = '1.0.3-12~visualtest12repair1'
          test "$(dpkg-deb -f "$DUOFACE_FILE" Architecture)" = 'iphoneos-arm64'
          dpkg-deb --contents "$DUOFACE_FILE" | grep -F 'DuoFaceVisualHook.dylib'
          dpkg-deb --contents "$DUOFACE_FILE" | grep -F 'DFVisual12GateRepair.dylib'
          # Only replace the VisualTest12 package. Never remove independent Hub.
          find repo/debs -maxdepth 1 -type f -name 'com.duoface.app_*.deb' -delete
          find repo/debs -maxdepth 1 -type f -name 'com.duonavi.app_*.deb' ! -name 'com.duonavi.app_1.0.3-12~visualtest12repair1_iphoneos-arm64.deb' -delete

          # Native12 Speed8 TEST: one UIView only in VERIFIED SpringBoard split native CBWindow.
          # Requires CBBridgedSplitApp.currentApp, >=2 live native appViews attached to same root.
          # No extra UIWindow, no CarPlayApp injection, Waze or GOFAHUD code.
          DUOFACE_NEW_URL='https://raw.githubusercontent.com/chuongnguyen89dn-ui/Duoface/1286a3ef868cf7e29804bcddf7e20b2eae707ce1/dist/payload-migration/native12-speed8compact/com.duoface.independent_0.1.0~native12+speed8compact_iphoneos-arm64.deb'
          DUOFACE_NEW_FILE='repo/debs/com.duoface.independent_0.1.0~native12+speed8compact_iphoneos-arm64.deb'
          curl -fL --retry 3 "$DUOFACE_NEW_URL" -o "$DUOFACE_NEW_FILE"
          printf '%s  %s\n' '2fe8892c5ef8762e1e83b0fd6c4a029e25fc11758cc98fdbbb851bf6637e68ad' "$DUOFACE_NEW_FILE" | shasum -a 256 -c -
          test "$(dpkg-deb -f "$DUOFACE_NEW_FILE" Package)" = 'com.duoface.independent'
          test "$(dpkg-deb -f "$DUOFACE_NEW_FILE" Version)" = '0.1.0~native12+speed8compact'
          test "$(dpkg-deb -f "$DUOFACE_NEW_FILE" Architecture)" = 'iphoneos-arm64'
          for unit in DuoFaceDashboard DuoFaceFullscreenBridge DuoFaceVisualHook DuoFaceLogoGripOnly DuoFaceSpeedHUD DuoFaceSpeedOwner; do
            dpkg-deb -c "$DUOFACE_NEW_FILE" | grep -F "$unit.dylib"
          done
