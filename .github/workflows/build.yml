name: Build and publish Sileo repo
# DuoDash-Airaw geometry sync: 6

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos and iOS SDK
        run: |
          brew install ldid xz dpkg
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          rm -rf "$HOME/theos/sdks"
          git clone --depth=1 https://github.com/theos/sdks.git "$HOME/theos/sdks"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          test -n "$(find "$HOME/theos/sdks" -maxdepth 1 -type d -name '*.sdk' -print -quit)"

      - name: Build corrected independent CarPlay Split
        run: |
          rm -f independent-split/packages/com.chuong.carplaysplit_*.deb packages/com.chuong.carplaysplit_*.deb
          bash independent-split/build.sh
          cp independent-split/packages/*.deb packages/

      - name: Set unique package version
        run: |
          sed -i '' "s/^Version:.*/Version: 0.0.${GITHUB_RUN_NUMBER}/" control

      - name: Build rootless package
        run: make clean package FINALPACKAGE=1

      - name: Build combined DuoDash + Airaw package
        shell: bash
        run: |
          set -euo pipefail
          brew install dpkg || true
          rm -rf /tmp/duo /tmp/aira /tmp/combined
          curl -fL "https://raw.githubusercontent.com/chuongnguyen89dn-ui/DauDat-CarPlay/main/DuoDash_1.1.3_Fullscreen427_iphoneos-arm64.deb" -o /tmp/duo.deb
          curl -fL "https://raw.githubusercontent.com/chuongnguyen89dn-ui/DauDat-CarPlay/main/com.Axs.airaw_1.6.7_iphoneos-arm64.deb" -o /tmp/aira.deb
          dpkg-deb -R /tmp/duo.deb /tmp/duo
          dpkg-deb -R /tmp/aira.deb /tmp/aira
          mkdir -p /tmp/combined/DEBIAN
          cp -a /tmp/duo/var /tmp/combined/
          cp -a /tmp/aira/var /tmp/combined/
          mkdir -p /tmp/combined/var/jb/Library/MobileSubstrate/DynamicLibraries
          cp .theos/_/var/jb/Library/MobileSubstrate/DynamicLibraries/DuoDashAirawConflictProbe.dylib /tmp/combined/var/jb/Library/MobileSubstrate/DynamicLibraries/
          cp .theos/_/var/jb/Library/MobileSubstrate/DynamicLibraries/DuoDashAirawConflictProbe.plist /tmp/combined/var/jb/Library/MobileSubstrate/DynamicLibraries/
          cat > /tmp/combined/DEBIAN/control <<'EOF'
          Package: com.chuong.duodash-airaw
          Name: DuoDash + Airaw
          Version: 1.0.3
          Architecture: iphoneos-arm64
          Maintainer: chuongnguyen89dn-ui
          Author: SenseTechLab / Axs
          Section: Tweaks
          Depends: mobilesubstrate (>= 0.9.5000) | ellekit, firmware (>= 14.0), preferenceloader, ws.hbang.common, com.opa334.ccsupport
          Conflicts: com.sensetechlab.duodash, com.axs.airaw, com.carnav.hud, com.carnav.core, com.carnav.bridge, com.carnav.hook, com.carnav.hud.prefs, com.carnav.prefs.refresh, com.carnav.hud.carplaydashboard, com.carnav.hud.appbridge, com.sensetechlab.carsleeper, com.sensetechlab.carplaytweak, com.sensetechlab.core, com.sensetechlab.bridge, com.sensetechlab.prefs.refresh, com.sensetechlab.duodash.prefs, com.sensetechlab.duodash.appbridge
          Replaces: com.sensetechlab.duodash, com.axs.airaw, com.carnav.hud, com.carnav.core, com.carnav.bridge, com.carnav.hook, com.carnav.hud.prefs, com.carnav.prefs.refresh, com.carnav.hud.carplaydashboard, com.carnav.hud.appbridge, com.sensetechlab.carsleeper, com.sensetechlab.carplaytweak, com.sensetechlab.core, com.sensetechlab.bridge, com.sensetechlab.prefs.refresh, com.sensetechlab.duodash.prefs, com.sensetechlab.duodash.appbridge
          Provides: com.sensetechlab.duodash, com.axs.airaw, com.carnav.hud, com.carnav.core, com.carnav.bridge, com.carnav.hud.prefs, com.carnav.prefs.refresh, com.sensetechlab.core, com.sensetechlab.bridge, com.sensetechlab.prefs.refresh, com.sensetechlab.duodash.prefs
          Description: Combined rootless package containing DuoDash 1.1.3+fullscreen1 and Airaw 1.6.7 for CarPlay.
          EOF
          cat > /tmp/combined/DEBIAN/postinst <<'EOF'
          #!/var/jb/bin/sh
          set -e
          JB=""; [ -d /var/jb ] && JB="/var/jb"
          LOGDIR="/var/mobile/Documents/DuoDash-Airaw-Logs"
          LOGFILE="$LOGDIR/Conflict.log"
          mkdir -p "$LOGDIR"
          touch "$LOGFILE"
          chown -R mobile:mobile "$LOGDIR" 2>/dev/null || true
          chmod 0775 "$LOGDIR" 2>/dev/null || true
          chmod 0664 "$LOGFILE" 2>/dev/null || true
          printf '\n%s | PACKAGE INSTALLED com.chuong.duodash-airaw 1.0.1\n' "$(date '+%Y-%m-%d %H:%M:%S')" >> "$LOGFILE"

          for d in "$JB/Library/Airaw" "$JB/Library/Airaw/Preferences" "$JB/Library/Airaw/backup"; do [ -d "$d" ] && chown mobile:mobile "$d" 2>/dev/null || true; done
          if [ -f "$JB/Library/LaunchDaemons/com.sensetechlab.autoinject.plist" ]; then
            launchctl unload "$JB/Library/LaunchDaemons/com.sensetechlab.autoinject.plist" 2>/dev/null || true
            launchctl load "$JB/Library/LaunchDaemons/com.sensetechlab.autoinject.plist" 2>/dev/null || true
          fi
          for r in bridge carsleep appbridge_cp prefsrefresh siriprobe; do rm -f "/var/mobile/Library/DuoDash/$r.arm" "/var/mobile/Library/DuoDash/$r.state" 2>/dev/null || true; done
          touch /var/mobile/Library/DuoDash/respring_planned 2>/dev/null || true
          killall -HUP SpringBoard 2>/dev/null || true
          exit 0
          EOF
          cp /tmp/duo/DEBIAN/prerm /tmp/combined/DEBIAN/prerm
          chmod 0755 /tmp/combined/DEBIAN /tmp/combined/DEBIAN/postinst /tmp/combined/DEBIAN/prerm
          chmod 0644 /tmp/combined/DEBIAN/control
          mkdir -p combined-package
          dpkg-deb --build --root-owner-group /tmp/combined combined-package/DuoDash-Airaw_1.0.3_iphoneos-arm64.deb
          dpkg-deb -c combined-package/DuoDash-Airaw_1.0.3_iphoneos-arm64.deb > /tmp/combined-contents.txt
          grep -q 'DuoDash.dylib' /tmp/combined-contents.txt
          grep -q 'Airaw.dylib' /tmp/combined-contents.txt
          grep -q 'DuoDashAirawConflictProbe.dylib' /tmp/combined-contents.txt

      - name: Restore complete original DuoDash payload for Sileo
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            'https://raw.githubusercontent.com/chuongnguyen89dn-ui/DauDat-CarPlay/5f683ad16a2c4f2b37e333e891cfb8f7ba3e0d6b/DuoDash_1.1.3_Fullscreen427_iphoneos-arm64.deb' \
            -o "$RUNNER_TEMP/duodash-base.deb"
          python3 scripts/package-duodash-fullscreen.py \
            "$RUNNER_TEMP/duodash-base.deb" \
            packages/com.chuong.duodash-fullscreen-complete_1.1.3+adapter1~test4_iphoneos-arm64.deb
          dpkg-deb -I packages/com.chuong.duodash-fullscreen-complete_*.deb
          dpkg-deb -c packages/com.chuong.duodash-fullscreen-complete_*.deb

      - name: Add byte-identical DuoDash source baseline
        shell: bash
        run: |
          set -euo pipefail
          BASE="packages/DuoDash-Source_1.1.3+fullscreen1_iphoneos-arm64.deb"
          curl -fL --retry 3 \
            'https://raw.githubusercontent.com/chuongnguyen89dn-ui/DauDat-CarPlay/5f683ad16a2c4f2b37e333e891cfb8f7ba3e0d6b/DuoDash_1.1.3_Fullscreen427_iphoneos-arm64.deb' \
            -o "$BASE"
          printf '%s  %s\n' 'ea0d3bb8c8b9da2b45c3f158f390a7966419e84899f820d06f45cd51401fa465' "$BASE" | shasum -a 256 -c -
          dpkg-deb -I "$BASE"

      - name: Pin verified independent CarPlay NativeBridge QA payload
        run: |
          set -euo pipefail
          mkdir -p repo/debs
          # Independent DuoFace Dashboard native sidebar QA, explicit TRIPLE opt-in.
          # Stable V1BC recovery, Native12/HUD8 and QA11 are separate packages.
          NATIVEBRIDGE_FILE='com.duoface.carplay.nativebridgeqa_0.0.6~dockcrop1_iphoneos-arm64.deb'
          NATIVEBRIDGE_SHA='549f1622ca23a8a4bbcf159518e2ca3ec345586aff7d33ce503e4723878e6228'
          NATIVEBRIDGE_URL="https://raw.githubusercontent.com/chuongnguyen89dn-ui/Duoface/bb92e7d90d973650f2d55735eb8d7a47f915f513/sideplay/test-artifacts/mytweak-native-bridgeqa6/$NATIVEBRIDGE_FILE"
          NATIVEBRIDGE_DEB="repo/debs/$NATIVEBRIDGE_FILE"
          curl -fL --retry 3 "$NATIVEBRIDGE_URL" -o "$NATIVEBRIDGE_DEB"
          printf '%s  %s\n' "$NATIVEBRIDGE_SHA" "$NATIVEBRIDGE_DEB" | shasum -a 256 -c -
          test "$(dpkg-deb -f "$NATIVEBRIDGE_DEB" Package)" = 'com.duoface.carplay.nativebridgeqa'
          test "$(dpkg-deb -f "$NATIVEBRIDGE_DEB" Version)" = '0.0.6~dockcrop1'
          test "$(dpkg-deb -f "$NATIVEBRIDGE_DEB" Architecture)" = 'iphoneos-arm64'
          dpkg-deb -f "$NATIVEBRIDGE_DEB" Depends | grep -F 'com.duoface.mytweak.v1a.preflight'
          ! dpkg-deb -f "$NATIVEBRIDGE_DEB" | grep -E '^(Conflicts|Replaces|Breaks):'
          dpkg-deb -c "$NATIVEBRIDGE_DEB" | grep -F '/DFNativeDashboardBridgeQA.dylib'
          dpkg-deb -c "$NATIVEBRIDGE_DEB" | grep -F '/DFNativeDashboardBridgeQA.plist'
          test "$(dpkg-deb -c "$NATIVEBRIDGE_DEB" | grep -cE '^-' )" -eq 2
          mkdir -p "$RUNNER_TEMP/nativebridgeqa-extract"
          dpkg-deb -x "$NATIVEBRIDGE_DEB" "$RUNNER_TEMP/nativebridgeqa-extract"
          NATIVEBRIDGE_PLIST="$RUNNER_TEMP/nativebridgeqa-extract/var/jb/Library/MobileSubstrate/DynamicLibraries/DFNativeDashboardBridgeQA.plist"
          NATIVEBRIDGE_PLIST="$NATIVEBRIDGE_PLIST" python3 - <<'PY'
          import os,plistlib
          with open(os.environ["NATIVEBRIDGE_PLIST"],"rb") as f: p=plistlib.load(f)
          assert p["Filter"]["Executables"]==["SpringBoard","CarPlay","CarPlayApp"],p
          print("DUOFACE_NATIVE_BRIDGEQA_BINARY_FILTER_EXACT_PASS")
          PY
          echo 'DUOFACE_NATIVE_BRIDGEQA_OPTIN_PINNED_PACKAGE_PASS'

      - name: Pin verified Filza-free DuoFace Bridge QA activation helper
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p repo/debs
          CONFIG_FILE='com.duoface.carplay.nativebridgeqa.activate_0.0.1~configfix1_iphoneos-arm64.deb'
          CONFIG_SHA='8f6e5261a077137337e48b5e43784f4beadd3c051158f26d1c0a42c46cc30d02'
          CONFIG_URL="https://raw.githubusercontent.com/chuongnguyen89dn-ui/Duoface/e715807fb167df280d78963de4e5e8a906050256/sideplay/test-artifacts/nativebridgeqa-activate-configfix1/$CONFIG_FILE"
          CONFIG_DEB="repo/debs/$CONFIG_FILE"
          curl -fL --retry 4 "$CONFIG_URL" -o "$CONFIG_DEB"
          printf '%s  %s\n' "$CONFIG_SHA" "$CONFIG_DEB" | shasum -a 256 -c -
          test "$(dpkg-deb -f "$CONFIG_DEB" Package)" = 'com.duoface.carplay.nativebridgeqa.activate'
          test "$(dpkg-deb -f "$CONFIG_DEB" Version)" = '0.0.1~configfix1'
          test "$(dpkg-deb -f "$CONFIG_DEB" Architecture)" = 'iphoneos-arm64'
          dpkg-deb -f "$CONFIG_DEB" Depends | grep -F 'com.duoface.carplay.nativebridgeqa'
          ! dpkg-deb -f "$CONFIG_DEB" | grep -E '^(Conflicts|Replaces|Breaks):'
          mkdir -p "$RUNNER_TEMP/activate-config-extract"
          dpkg-deb -x "$CONFIG_DEB" "$RUNNER_TEMP/activate-config-extract"
          dpkg-deb -e "$CONFIG_DEB" "$RUNNER_TEMP/activate-config-extract/DEBIAN"
          test -x "$RUNNER_TEMP/activate-config-extract/DEBIAN/postinst"
          test -x "$RUNNER_TEMP/activate-config-extract/DEBIAN/prerm"
          test "$(find "$RUNNER_TEMP/activate-config-extract/var" -type f | wc -l | tr -d ' ')" -eq 1
          python3 - <<'PY'
          import plistlib, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'activate-config-extract/var/jb/usr/share/doc/duoface-nativebridgeqa-activate/enabled.plist'
          assert plistlib.loads(root.read_bytes())=={'Enabled':True,'NativeSidebarTrial':True}
          print('NATIVE_BRIDGEQA_FILZA_FREE_CONF_HELPER_EXPLICIT_OPTIN_VERIFIED')
          PY

      - name: Pin V6 read-only CarPlay controller sceneHostView Maps owner diagnostic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p repo/debs
          FILE='com.duoface.carplay.nativejoinprobe_0.0.4~mapowner1_iphoneos-arm64.deb'
          SHA='b6ec4ec654cfc1d0f38d3f2361bf0fc45cb33b626df897fbaae75dbf9606609f'
          URL="https://raw.githubusercontent.com/chuongnguyen89dn-ui/Duoface/d438c52f0b4a26dd0248c3f53a45210fcb1e7618/sideplay/test-artifacts/native-map-owner-v6/$FILE"
          DEB="repo/debs/$FILE"
          curl -fLsS --retry 4 "$URL" -o "$DEB"
          printf '%s  %s\n' "$SHA" "$DEB" | shasum -a 256 -c -
          test "$(dpkg-deb -f "$DEB" Package)" = com.duoface.carplay.nativejoinprobe
          test "$(dpkg-deb -f "$DEB" Version)" = '0.0.4~mapowner1'
          test "$(dpkg-deb -f "$DEB" Architecture)" = iphoneos-arm64
          ! dpkg-deb -f "$DEB" | grep -E '^(Conflicts|Replaces|Breaks):'
          dpkg-deb -c "$DEB" | grep -F '/DFNativeSceneJoinProbe.dylib'
          dpkg-deb -c "$DEB" | grep -F '/DFNativeSceneJoinProbe.plist'
          test "$(dpkg-deb -c "$DEB" | grep -c '^-' )" -eq 2
          mkdir -p "$RUNNER_TEMP/native-scene-probe"
          dpkg-deb -x "$DEB" "$RUNNER_TEMP/native-scene-probe"
          FILTER="$RUNNER_TEMP/native-scene-probe/var/jb/Library/MobileSubstrate/DynamicLibraries/DFNativeSceneJoinProbe.plist"
          FILTER="$FILTER" python3 - <<'PY'
          import plistlib,os
          with open(os.environ['FILTER'],'rb') as f: p=plistlib.load(f)
          assert p['Filter']['Executables']==['CarPlay','CarPlayApp'],p
          print('READONLY_DASHBOARD_SCENE_PROBE_FILTER_PASS')
          PY
          echo NATIVE_CARPLAY_SCENE_PROBE_PINNED_SHA_PASS

      - name: Pin independent SpringBoard-only OFF-by-default admission ABI probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p repo/debs
          FILE='com.duoface.carplay.sbadmissionprobe_0.0.1~readonly1_iphoneos-arm64.deb'
          SHA='32d1af9bd32f53d0e10c445c0b69941924dc6c2f18601aa01bc9361b7ddf8ffa'
          URL="https://raw.githubusercontent.com/chuongnguyen89dn-ui/Duoface/15dac7e795733c1e33f63c4fdbd6c8433784eca4/sideplay/test-artifacts/sb-admission-probe1/$FILE"
          DEB="repo/debs/$FILE"
          curl -fLsS --retry 4 "$URL" -o "$DEB"
          printf '%s  %s\n' "$SHA" "$DEB" | shasum -a 256 -c -
          test "$(dpkg-deb -f "$DEB" Package)" = 'com.duoface.carplay.sbadmissionprobe'
          test "$(dpkg-deb -f "$DEB" Version)" = '0.0.1~readonly1'
          test "$(dpkg-deb -f "$DEB" Architecture)" = iphoneos-arm64
          ! dpkg-deb -f "$DEB" | grep -E '^(Conflicts|Replaces|Breaks):'
          dpkg-deb -c "$DEB" > "$RUNNER_TEMP/duoface-sb-admission-filelist.txt"
          test "$(grep -c '^-' "$RUNNER_TEMP/duoface-sb-admission-filelist.txt")" -eq 2
          grep -F '/DFReadOnlySBAdmissionProbe.dylib' "$RUNNER_TEMP/duoface-sb-admission-filelist.txt"
          grep -F '/DFReadOnlySBAdmissionProbe.plist' "$RUNNER_TEMP/duoface-sb-admission-filelist.txt"
          mkdir -p "$RUNNER_TEMP/duoface-sb-admission-extract"
          dpkg-deb -x "$DEB" "$RUNNER_TEMP/duoface-sb-admission-extract"
          FILTER="$RUNNER_TEMP/duoface-sb-admission-extract/var/jb/Library/MobileSubstrate/DynamicLibraries/DFReadOnlySBAdmissionProbe.plist"
          FILTER="$FILTER" python3 - <<'PY'
          import plistlib,os
          with open(os.environ['FILTER'],'rb') as f: p=plistlib.load(f)
          assert p['Filter']['Executables']==['SpringBoard'],p
          print('READONLY_OPTIN_SPRINGBOARD_ONLY_FILTER_PASS')
          PY
          echo DUOFACE_SPRINGBOARD_ABI_PROBE_PINNED_SHA_PASS

      - name: Pin DuoFace first-party CarPlay gate and native host (opt-in only)
        shell: bash
        run: |
          set -euo pipefail
          SOURCE='https://raw.githubusercontent.com/chuongnguyen89dn-ui/Duoface/af91792178f1586a649056aeae99543cd00d06ff/sideplay/test-artifacts/firstparty-carplay-ready1'
          mkdir -p repo/debs
          GATE_FILE='com.duoface.carplay.firstpartyadmission_0.0.5~ready1_iphoneos-arm64.deb'
          GATE_SHA='a801a165da651948735e1c0f1de9302762236b5a95ed4b6b61b7d0116635104d'
          GATE_DEB="repo/debs/$GATE_FILE"
          curl -fLsS --retry 4 "$SOURCE/$GATE_FILE" -o "$GATE_DEB"
          printf '%s  %s\n' "$GATE_SHA" "$GATE_DEB" | shasum -a 256 -c -
          test "$(dpkg-deb -f "$GATE_DEB" Package)" = 'com.duoface.carplay.firstpartyadmission'
          test "$(dpkg-deb -f "$GATE_DEB" Version)" = '0.0.5~ready1'
          test "$(dpkg-deb -f "$GATE_DEB" Architecture)" = iphoneos-arm64
          ! dpkg-deb -f "$GATE_DEB" | grep -E '^(Conflicts|Replaces|Breaks):'
          mkdir -p "$RUNNER_TEMP/df-firstparty-extract"
          dpkg-deb -x "$GATE_DEB" "$RUNNER_TEMP/df-firstparty-extract"
          FILTER="$(find "$RUNNER_TEMP/df-firstparty-extract" -name DFFirstPartyAdmission.plist -print -quit)"
          test -n "$FILTER"
          FILTER="$FILTER" python3 - <<'PY'
          import os,plistlib
          with open(os.environ['FILTER'],'rb') as f: p=plistlib.load(f)
          assert p['Filter']['Executables']==['CarPlay'],p
          print('DUOFACE_FIRSTPARTY_GATE_ONLY_CARPLAY_PASS')
          PY
          HOST_FILE='com.duoface.carplay.nativescenehost_0.1.10~atomicreplace1_iphoneos-arm64.deb'
          HOST_SHA='eab09aa696497de95e67038ec15d3d0013ecbd4a41502dccc508dbc6ddd0818d'
          HOST_DEB="repo/debs/$HOST_FILE"
          HOST_SOURCE='https://raw.githubusercontent.com/chuongnguyen89dn-ui/Duoface/99c46e2bdaf69f8925499b605bbd5e33406a86d6/sideplay/duoface-native-scene-host/packages/com.duoface.carplay.nativescenehost_0.1.10~atomicreplace1_iphoneos-arm64.deb'
          curl -fLsS --retry 4 "$HOST_SOURCE" -o "$HOST_DEB"
          printf '%s  %s\n' "$HOST_SHA" "$HOST_DEB" | shasum -a 256 -c -
          test "$(dpkg-deb -f "$HOST_DEB" Package)" = 'com.duoface.carplay.nativescenehost'
          test "$(dpkg-deb -f "$HOST_DEB" Version)" = '0.1.10~atomicreplace1'
          test "$(dpkg-deb -f "$HOST_DEB" Architecture)" = iphoneos-arm64
          ! dpkg-deb -f "$HOST_DEB" | grep -E '^(Conflicts|Replaces|Breaks):'
          mkdir -p "$RUNNER_TEMP/df-firstparty-host"
          dpkg-deb -x "$HOST_DEB" "$RUNNER_TEMP/df-firstparty-host"
          test -s "$RUNNER_TEMP/df-firstparty-host/var/jb/Applications/DuoFaceNativeHost.app/DuoFaceNativeHost"
          python3 - <<'PY'
          from pathlib import Path
          import plistlib,os
          p=Path(os.environ['RUNNER_TEMP'])/'df-firstparty-host/var/jb/Applications/DuoFaceNativeHost.app/Info.plist'
          d=plistlib.loads(p.read_bytes())
          assert d['CFBundleIdentifier']=='com.duoface.native.scenehost',d
          roles=d['UIApplicationSceneManifest']['UISceneConfigurations']
          assert 'UIWindowSceneSessionRoleCarPlay' in roles,roles
          template=roles['CPTemplateApplicationSceneSessionRoleApplication'][0]
          assert template['UISceneClassName']=='CPTemplateApplicationScene',template
          assert template['UISceneDelegateClassName']=='DFNativeHostTemplateSceneDelegate',template
          print('DUOFACE_FIRSTPARTY_HOST_CPTEMPLATE_AND_NATIVE_SCENE_ROLE_PASS')
          PY
          echo DUOFACE_FIRSTPARTY_ADMISSION_CANDIDATES_PINNED_NO_AUTOMATIC_ACTIVATION

      - name: Add signed DuoFace QA iPhone control app from immutable verified source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p repo/debs
          QAAPP_FILE='com.duoface.qa.controlapp_0.1.7~ready1_iphoneos-arm64.deb'
          QAAPP_SHA='5cb40dca73c4e9acc2e0e246485c0d6a5d895fa42a7f50379f24f99c9df5c4a8'
          QAAPP_URL="https://raw.githubusercontent.com/chuongnguyen89dn-ui/Duoface/af91792178f1586a649056aeae99543cd00d06ff/sideplay/test-artifacts/firstparty-carplay-ready1/$QAAPP_FILE"
          QAAPP_DEB="repo/debs/$QAAPP_FILE"
          curl -fLsS --retry 4 "$QAAPP_URL" -o "$QAAPP_DEB"
          printf '%s  %s\n' "$QAAPP_SHA" "$QAAPP_DEB" | shasum -a 256 -c -
          test "$(dpkg-deb -f "$QAAPP_DEB" Package)" = 'com.duoface.qa.controlapp'
          test "$(dpkg-deb -f "$QAAPP_DEB" Version)" = '0.1.7~ready1'
          test "$(dpkg-deb -f "$QAAPP_DEB" Architecture)" = 'iphoneos-arm64'
          dpkg-deb -f "$QAAPP_DEB" Depends | grep -F 'com.duoface.carplay.nativebridgeqa (>= 0.0.5~controlapp1)'
          dpkg-deb -f "$QAAPP_DEB" Depends | grep -F 'com.duoface.carplay.nativejoinprobe (>= 0.0.1~sceneprobe1)'
          dpkg-deb -f "$QAAPP_DEB" Depends | grep -F 'com.duoface.carplay.sbadmissionprobe (>= 0.0.1~readonly1)'
          dpkg-deb -f "$QAAPP_DEB" Depends | grep -F 'com.duoface.carplay.firstpartyadmission (>= 0.0.5~ready1)'
          dpkg-deb -f "$QAAPP_DEB" Depends | grep -F 'com.duoface.carplay.nativescenehost (>= 0.0.1~scenehost1)'
          ! dpkg-deb -f "$QAAPP_DEB" | grep -E '^(Conflicts|Replaces|Breaks):'
          dpkg-deb -c "$QAAPP_DEB" | grep -F '/Applications/DuoFaceQA.app/DuoFaceQA'
          dpkg-deb -c "$QAAPP_DEB" | grep -F '/Applications/DuoFaceQA.app/AppIcon60x60@3x.png'
          echo DUOFACE_QA_IPHONE_APP_IN_APT_PREPARED

      - name: Pin tested launchable DuoFace Test iPhone app from project release
