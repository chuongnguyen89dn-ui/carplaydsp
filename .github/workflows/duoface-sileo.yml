name: DuoFace package validation and Sileo staging
on:
  workflow_dispatch:
  push:
    paths:
      - 'duoface/debs/**'
      - '.github/workflows/duoface-sileo.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate isolated DuoFace DEB and generate APT index
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev
          mkdir -p staging/debs
          shopt -s nullglob
          files=(duoface/debs/*.deb)
          if (( ${#files[@]} == 0 )); then
            echo "::error::No DuoFace DEB uploaded at duoface/debs/. Upload actual binary before publishing."
            exit 1
          fi
          for f in "${files[@]}"; do
            dpkg-deb --info "$f"
            pkg=$(dpkg-deb -f "$f" Package)
            arch=$(dpkg-deb -f "$f" Architecture)
            test "$pkg" = com.duoface.app || { echo "::error::Wrong package id: $pkg"; exit 1; }
            test "$arch" = iphoneos-arm64 || { echo "::error::Wrong architecture: $arch"; exit 1; }
            control=$(dpkg-deb -f "$f")
            if printf '%s\n' "$control" | grep -Eiq '^(Conflicts|Replaces|Breaks):.*(duonavi|com\.duonavi)'; then
              echo "::error::DuoFace conflicts with DuoNavi"
              exit 1
            fi
            dpkg-deb --contents "$f" >/dev/null
            cp "$f" staging/debs/
          done
          cd staging
          dpkg-scanpackages -m debs /dev/null > Packages
          gzip -9c Packages > Packages.gz
          test -s Packages
          grep -q '^Package: com.duoface.app$' Packages
          cat > Release <<'EOF'
          Origin: CarPlayDSP
          Label: CarPlayDSP DuoFace staging
          Suite: stable
          Codename: ios-rootless
          Architectures: iphoneos-arm64
          Components: main
          Description: DuoFace validation staging, not published to live Sileo
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: DuoFace-APT-staging
          path: staging/
