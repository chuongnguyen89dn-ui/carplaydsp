            test "$(dpkg-deb -c "$DUOFACE_NEW_FILE" | grep -c "$unit.dylib")" -eq 1
            test "$(dpkg-deb -c "$DUOFACE_NEW_FILE" | grep -c "$unit.plist")" -eq 1
          done
          mkdir -p "$RUNNER_TEMP/duoface-speed8-split-verify"
          dpkg-deb -x "$DUOFACE_NEW_FILE" "$RUNNER_TEMP/duoface-speed8-split-verify"
          dir="$RUNNER_TEMP/duoface-speed8-split-verify/var/jb/Library/MobileSubstrate/DynamicLibraries"
          for unit in DuoFaceSpeedHUD DuoFaceSpeedOwner; do
            grep -Fq '"SpringBoard"' "$dir/$unit.plist"
            ! grep -Eiq 'CarPlayApp|CarPlayTemplateUIHost|Waze|GOFA' "$dir/$unit.plist"
          done
          printf '%s  %s\n' '8968e1724afda7087c258cd1146eac014e29daf2bf823e734bca91a81881a364' "$dir/DuoFaceSpeedHUD.dylib" | shasum -a 256 -c -
          printf '%s  %s\n' 'd3725aca26dbee03cc1ad8697612004f405b2f3759c94656eb3451f39422fee3' "$dir/DuoFaceSpeedOwner.dylib" | shasum -a 256 -c -
          ! dpkg-deb -c "$DUOFACE_NEW_FILE" | grep -E 'A_DuoFaceNativeNoLease|DuoFaceSpeedSources|VietMapGoogleMapsSource|WazeGMapHUDSource|GofaGMapHUDSource|GMapHUDOverspeedScreen|GMapHUDPlacementRelay|GoogleMapsVietMap'
          ! dpkg-deb -c "$DUOFACE_NEW_FILE" | grep -E '/DuoFace(SmartConnection|InCarAddApps)\.dylib'
          dpkg --compare-versions '0.1.0~native12+speed8compact' gt '0.1.0~native12+speed6zzowner1'
          find repo/debs -maxdepth 1 -type f -name 'com.duoface.independent_*.deb' ! -name 'com.duoface.independent_0.1.0~native12+speed8compact_iphoneos-arm64.deb' -delete
          echo 'SILEO_SPEED8_NATIVE_SPRINGBOARD_ONLY_SPLIT_TWO_PANES_AND_SHA_PASS'

          # Standalone Visual12 QA package (separate ID; never replace Native12 + Hub8).
          # Independent Native12 no-expand app pill QA7 verified in DuoFace Actions 39102665926.
          # Same-byte, SHA-pinned download; no changes to stable Native12 + Hub8 package.
          VISUAL12_QA_URL='https://raw.githubusercontent.com/chuongnguyen89dn-ui/Duoface/31212aa59fbaad2f175e505851cd4e7415579f00/dist/visual12-native-shell7-visual-qa/com.duoface.visual12_1.0.3-12~ui8native7_iphoneos-arm64.deb'
          VISUAL12_QA_FILE='repo/debs/com.duoface.visual12_1.0.3-12~ui8native7_iphoneos-arm64.deb'
          curl -fL --retry 3 "$VISUAL12_QA_URL" -o "$VISUAL12_QA_FILE"
          printf '%s  %s\n' '57ae2b34487b3c24fc584ab2d1bf6b44abe6797c8c7d14628004e2bb78c62137' "$VISUAL12_QA_FILE" | shasum -a 256 -c -
          test "$(dpkg-deb -f "$VISUAL12_QA_FILE" Package)" = 'com.duoface.visual12'
          test "$(dpkg-deb -f "$VISUAL12_QA_FILE" Version)" = '1.0.3-12~ui8native7'
          test "$(dpkg-deb -f "$VISUAL12_QA_FILE" Architecture)" = 'iphoneos-arm64'
          dpkg --compare-versions '1.0.3-12~ui8native7' gt '1.0.3-12~ui8native6'
