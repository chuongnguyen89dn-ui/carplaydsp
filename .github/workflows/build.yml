  verify-qa11-pages:
    # Verify exactly what Sileo can retrieve, not only the uploaded Pages artifact.
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify live Sileo Packages Release and QA11 DEB checksum
        shell: bash
        run: |
          set -euo pipefail
          SITE='https://chuongnguyen89dn-ui.github.io/carplaydsp'
          VERSION='0.1.9~native12dock11'
          FILE='com.duoface.sideplaydisplay_0.1.9~native12dock11_iphoneos-arm64.deb'
          EXPECTED='0d20390c560452b0c68c9311ae3c58a48bc9d3e7528de1b130c6bca58c87c1b9'
          for i in $(seq 1 15); do
            if curl --fail --location --silent --show-error \
                 --max-time 25 "$SITE/Packages" -o "$RUNNER_TEMP/qa11-Packages"; then
              if grep -Fqx "Version: $VERSION" "$RUNNER_TEMP/qa11-Packages" &&
                 grep -Fqx "SHA256: $EXPECTED" "$RUNNER_TEMP/qa11-Packages"; then
                break
              fi
            fi
            echo "QA11 public APT index not updated yet: attempt $i/15"
            sleep 15
          done
          export QA11_VERSION="$VERSION" QA11_FILE="$FILE" QA11_HASH="$EXPECTED"
          python3 - <<'PY'
          import os
          from pathlib import Path
          text=Path(os.environ["RUNNER_TEMP"],"qa11-Packages").read_text()
          matching=[]
          for stanza in text.split("\n\n"):
              fields={}
              for line in stanza.splitlines():
                  if ": " in line and not line.startswith(" "):
                      k,v=line.split(": ",1)
                      fields[k]=v
              if fields.get("Package")=="com.duoface.sideplaydisplay":
                  matching.append(fields)
          assert len(matching)==1, f"QA package entries: {len(matching)}"
          q=matching[0]
          assert q.get("Version")==os.environ["QA11_VERSION"],q
          assert q.get("SHA256")==os.environ["QA11_HASH"],q
          assert q.get("Filename")=="debs/"+os.environ["QA11_FILE"],q
          assert "com.sideplay" in q.get("Depends",""),q
          print("QA11_SILEO_PUBLIC_PACKAGES_ONE_ENTRY_VERSION_SHA_DEPENDENCY_PASS")
          PY
          curl --fail --location --silent --show-error --retry 4 \
            "$SITE/Release" -o "$RUNNER_TEMP/qa11-Release"
          grep -F 'SHA256:' "$RUNNER_TEMP/qa11-Release"
          curl --fail --location --silent --show-error --retry 4 \
            "$SITE/debs/$FILE" -o "$RUNNER_TEMP/qa11-download.deb"
          printf '%s  %s\n' "$EXPECTED" "$RUNNER_TEMP/qa11-download.deb" | sha256sum -c -
          FILE_OUT='release-checkpoints/qa11-native12dock11-pages-verified.txt'
          mkdir -p "$(dirname "$FILE_OUT")"
          {
            printf 'QA11_SILEO_PAGES_DEPLOY_VERIFIED\n'
            printf 'RUN_ID=%s\n' "$GITHUB_RUN_ID"
            printf 'PAGES_URL=%s/\n' "$SITE"
            printf 'APT_PACKAGE=com.duoface.sideplaydisplay\n'
            printf 'VERSION=%s\n' "$VERSION"
            printf 'DEB_SHA256=%s\n' "$EXPECTED"
            printf 'SOURCE_COMMIT=%s\n' "$GITHUB_SHA"
            printf 'VERIFIED_UTC=%s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          } > "$FILE_OUT"
          cat "$FILE_OUT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$FILE_OUT"
          git commit -m 'docs(sileo): verify QA11 live Pages Packages and DEB hash [skip ci]'
          git push origin HEAD:main
          echo QA11_SILEO_PUBLIC_INDEX_AND_BINARY_DEPLOY_SUCCESS

      - name: Verify MyTweak Stable V1BC Emergency Recovery live Sileo index and binary independently of QA11
        shell: bash
        run: |
          set -euo pipefail
          SITE='https://chuongnguyen89dn-ui.github.io/carplaydsp'
          PKG='com.duoface.mytweak.v1a.preflight'
          VER='0.2.6~recovery1'
          FILE='com.duoface.mytweak.v1a.preflight_0.2.6~recovery1_iphoneos-arm64.deb'
          SHA='1c3cbb637754878c12d4dfb81731c31b19bb99b385ea3cfbd8dde20617baca12'
          for attempt in $(seq 1 15); do
            if curl -fLsS --max-time 25 "$SITE/Packages" -o "$RUNNER_TEMP/mytweak-recovery1-Packages"; then
              if grep -Fqx "SHA256: $SHA" "$RUNNER_TEMP/mytweak-recovery1-Packages"; then break; fi
            fi
            echo "Waiting for MyTweak Stable V1BC Emergency Recovery APT listing: $attempt/15"
            sleep 15
          done
          export V1A_PACKAGE="$PKG" V1A_VERSION="$VER" V1A_SHA="$SHA" V1A_FILE="$FILE"
          python3 - <<'PY'
          import os
          from pathlib import Path
          stanzas=Path(os.environ['RUNNER_TEMP'],'mytweak-recovery1-Packages').read_text().split('\n\n')
          hits=[]
          for stanza in stanzas:
              fields={}
              for line in stanza.splitlines():
                  if ': ' in line and not line.startswith(' '):
                      k,v=line.split(': ',1);fields[k]=v
              if fields.get('Package')==os.environ['V1A_PACKAGE']:
                  hits.append(fields)
          assert len(hits)==1, f'MyTweak Stable V1BC Emergency Recovery index count {len(hits)}'
          d=hits[0]
          assert d['Version']==os.environ['V1A_VERSION'],d
          assert d['SHA256']==os.environ['V1A_SHA'],d
          assert d['Filename']=='debs/'+os.environ['V1A_FILE'],d
          assert d['Architecture']=='iphoneos-arm64',d
          assert 'com.sideplay' not in d.get('Depends',''),d
          assert not any(d.get(k) for k in ('Conflicts','Replaces','Breaks')),d
          print('MYTWEAK_RECOVERY1_SILEO_LIVE_INDEX_ONE_ENTRY_VERSION_SHA_AND_NO_CONFLICT_PASS')
          PY
          curl -fLsS --retry 4 "$SITE/Release" -o "$RUNNER_TEMP/mytweak-recovery1-Release"
          grep -Fq 'SHA256:' "$RUNNER_TEMP/mytweak-recovery1-Release"
          curl -fLsS --retry 4 "$SITE/debs/$FILE" -o "$RUNNER_TEMP/mytweak-recovery1-download.deb"
          printf '%s  %s\n' "$SHA" "$RUNNER_TEMP/mytweak-recovery1-download.deb" | sha256sum -c -
          test "$(dpkg-deb -f "$RUNNER_TEMP/mytweak-recovery1-download.deb" Package)" = "$PKG"
          test "$(dpkg-deb -f "$RUNNER_TEMP/mytweak-recovery1-download.deb" Version)" = "$VER"
          F='release-checkpoints/mytweak-recovery1-pages-verified.txt'
          {
            echo 'MYTWEAK_RECOVERY1_SILEO_PAGES_DEPLOY_VERIFIED'
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo "PAGES_URL=$SITE/"
            echo "PACKAGE=$PKG"
            echo "VERSION=$VER"
            echo "DEB_SHA256=$SHA"
            echo "SOURCE_SHA=$GITHUB_SHA"
            echo "VERIFIED_UTC=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo 'DEVICE_TESTED=false'
            echo 'SCENE_HOST_INCLUDED=true'
            echo 'APP_PIXELS_VERIFIED=false'
            echo 'REAL_APPDOCK_VERIFIED=false'
            echo 'DASHBOARD_CONTEXT_NATIVE_WINDOW_PROBE=true'
            echo 'DBDOCKWINDOW_HOOK_IN_PACKAGE=false'
            echo 'CARPLAY_DASHBOARD_CONTEXT_DEVICE_VERIFIED=false'
            echo 'NATIVE_CARPLAY_SCENE_PACKAGED=false'
            echo 'DASHBOARD_WORKSPACE_ACTIVATION_SOURCE=false'
            echo 'RECOVERY_FROM_UNSTABLE_SHELL1=true'
            echo 'HOT_PATH_ADMISSION_HOOK_REMOVED=true'
            echo 'NATIVE_DOCK_STILL_UNRESOLVED=true'
            echo 'REAL_NATIVE_APPDOCK_DEVICE_VERIFIED=false'
            echo 'APPLE_APPDOCK_HOME_NAVIGATION_VERIFIED=false'
            echo 'NATIVE_DOCK_LAYOUT_CANDIDATE=false'
            echo 'NATIVE_APPDOCK_DEVICE_TESTED=false'
          } > "$F"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$F"
          git commit -m 'docs(sileo): verify MyTweak Stable V1BC Emergency Recovery public APT and binary checksum [skip ci]'
          git push origin HEAD:main
          echo MYTWEAK_RECOVERY1_SILEO_INDEX_AND_PUBLIC_DEB_VERIFIED

